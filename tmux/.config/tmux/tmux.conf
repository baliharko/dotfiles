set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @plugin 'baliharko/tmux-agent-popup'

# Leave agent popups' background to Ghostty so its blur shows through them;
# painted in the terminal's colour, they'd be drawn solid.
set -g @agent_popup_transparent on

# custom: runs tmux-agent-popup's summary of running agents: a red, yellow
# and green light (waiting, working, idle) with a count each. Double quotes
# so tmux expands $HOME; the theme needs a full path to an executable.
set -g @kanagawa-plugins "custom:$HOME/.config/tmux/plugins/tmux-agent-popup/scripts/status time git attached-clients battery"
# Hide segments with no output, e.g. the agents one while none is running.
set -g @kanagawa-show-empty-plugins false
# The lights need a dark background, and light text to match the counts,
# which the script draws in the status line's default colour.
set -g @kanagawa-custom-plugin-colors 'bg_pane text'
# Don't let the theme paint pane backgrounds (newer plugin versions use a
# lighter gray); keep the terminal's own background.
set -g @kanagawa-ignore-window-colors true
# Leave the status bar's own background unpainted too, so the terminal's
# translucent, blurred background shows through it. The segments keep theirs.
set -g @kanagawa-transparent-powerline-bg true
set -g @kanagawa-military-time true
set -g @kanagawa-show-powerline true

set -g prefix C-s
unbind-key C-b
bind-key C-s send-prefix

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set-window-option -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

# Pass terminal focus changes through to programs like Neovim, so it can
# check for files changed on disk when you switch back to its pane.
set -g focus-events on

# tpm detects this config at the XDG path and uses ~/.config/tmux/plugins
run '~/.config/tmux/plugins/tpm/tpm'
