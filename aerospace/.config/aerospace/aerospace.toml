# AeroSpace config. Commands reference: https://nikitabobko.github.io/AeroSpace/commands

after-startup-command = ['exec-and-forget /usr/local/bin/yoink --daemon']
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Move mouse to the center of a monitor when focus moves to it
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       8
    outer.bottom =     8
    outer.top =        8
    outer.right =      8

[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = 'main'
    6 = 'main'
    B = ['secondary', 'main']
    C = ['secondary', 'main']
    D = ['secondary', 'main']
    E = ['secondary', 'main']
    F = ['secondary', 'main']

[mode.main.binding]
    alt-comma = 'layout tiles horizontal vertical'

    # Focus
    alt-shift-ctrl-cmd-h = 'focus left'
    alt-shift-ctrl-cmd-j = 'focus down'
    alt-shift-ctrl-cmd-k = 'focus up'
    alt-shift-ctrl-cmd-l = 'focus right'

    # Move window
    alt-h = 'move left'
    alt-j = 'move down'
    alt-k = 'move up'
    alt-l = 'move right'

    # Resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Switch workspace
    alt-shift-ctrl-cmd-1 = 'workspace 1'
    alt-shift-ctrl-cmd-2 = 'workspace 2'
    alt-shift-ctrl-cmd-3 = 'workspace 3'
    alt-shift-ctrl-cmd-4 = 'workspace 4'
    alt-shift-ctrl-cmd-5 = 'workspace 5'
    alt-shift-ctrl-cmd-6 = 'workspace 6'
    alt-shift-ctrl-cmd-b = 'workspace B'
    alt-shift-ctrl-cmd-c = 'workspace C'
    alt-shift-ctrl-cmd-d = 'workspace D'
    alt-shift-ctrl-cmd-e = 'workspace E'
    alt-shift-ctrl-cmd-f = 'workspace F'

    # Move window to workspace
    alt-cmd-1 = 'move-node-to-workspace 1'
    alt-cmd-2 = 'move-node-to-workspace 2'
    alt-cmd-3 = 'move-node-to-workspace 3'
    alt-cmd-4 = 'move-node-to-workspace 4'
    alt-cmd-5 = 'move-node-to-workspace 5'
    alt-cmd-6 = 'move-node-to-workspace 6'
    alt-cmd-b = 'move-node-to-workspace B'
    alt-cmd-c = 'move-node-to-workspace C'
    alt-cmd-d = 'move-node-to-workspace D'
    alt-cmd-e = 'move-node-to-workspace E'
    alt-cmd-f = 'move-node-to-workspace F'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-comma = 'mode service'

    alt-ctrl-enter = "fullscreen"
    alt-ctrl-cmd-shift-t = "layout floating tiling"

    # Yoink - pull a window from another workspace into the current one
    alt-shift-ctrl-cmd-y = 'exec-and-forget /usr/local/bin/yoink'
    alt-shift-ctrl-cmd-u = 'exec-and-forget /usr/local/bin/yoink --yeet'

# Service mode: each binding runs, then returns to main mode
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # toggle floating/tiling
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
